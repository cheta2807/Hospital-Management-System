# Run everything:  docker compose up --build
#   Frontend      http://localhost:3000
#   Django API    http://localhost:8000/api/   (admin: /admin/)
#   Notifications http://localhost:5000/health
name: hospital-management-system

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hms_db}
      MYSQL_USER: ${MYSQL_USER:-hms_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hms_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend-django
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-dev-only-secret-key-please-change-0123456789}
      DEBUG: ${DEBUG:-false}
      COOKIE_SECURE: "false" # plain http on localhost
      DB_NAME: ${MYSQL_DATABASE:-hms_db}
      DB_USER: ${MYSQL_USER:-hms_user}
      DB_PASSWORD: ${MYSQL_PASSWORD:-hms_password}
      DB_HOST: db
      DB_PORT: "3306"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000}
      TIME_ZONE: ${TIME_ZONE:-Asia/Kolkata}
      SEED_DEMO: ${SEED_DEMO:-true}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-internal-key}
    ports:
      - "8000:8000"

  notification:
    build: ./notification-service
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DJANGO_API_URL: http://backend:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-internal-key}
      CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      HOSPITAL_NAME: ${HOSPITAL_NAME:-City Care Hospital}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@hospital.local}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
        VITE_NOTIFY_URL: ${VITE_NOTIFY_URL:-http://localhost:5000/api}
        VITE_SHOW_DEMO: ${VITE_SHOW_DEMO:-true}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
